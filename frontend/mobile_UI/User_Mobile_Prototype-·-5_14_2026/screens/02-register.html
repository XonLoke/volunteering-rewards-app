<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register · Volunteering Rewards</title>
  <link rel="stylesheet" href="../css/screen.css" />
</head>
<body style="display:grid;place-items:center;min-height:100vh;background:radial-gradient(60% 80% at 50% 0%, color-mix(in oklch, var(--accent) 6%, var(--bg)) 0%, var(--bg) 60%)">
  <div class="page-frame">
    <span class="btn-rail left-1"  aria-hidden></span>
    <span class="btn-rail left-2"  aria-hidden></span>
    <span class="btn-rail left-3"  aria-hidden></span>
    <span class="btn-rail right-1" aria-hidden></span>
    <span class="island"           aria-hidden></span>

    <div class="screen">
      <div class="statusbar">
        <span class="num">9:41</span>
        <span class="right">
          <svg viewBox="0 0 17 11" aria-hidden><rect x="0" y="7" width="3" height="4" rx="0.6"/><rect x="4" y="5" width="3" height="6" rx="0.6"/><rect x="8" y="3" width="3" height="8" rx="0.6"/><rect x="12" y="0" width="3" height="11" rx="0.6"/></svg>
          <svg viewBox="0 0 17 11" aria-hidden><path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/></svg>
          <svg class="battery" viewBox="0 0 25 11" aria-hidden><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/><rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg>
          </span>
      </div>

      <main class="content" data-od-id="register">
        <section class="pad" style="padding-top:16px;">
          <button class="btn-ghost" style="align-self:flex-start;padding-left:0;" onclick="history.back()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
            Back
          </button>
        </section>

        <section class="pad stack" style="gap:6px;padding-top:0;">
          <h1 class="h1">Create Account</h1>
          <p style="color:var(--muted);font-size:14px;margin:0;">Join thousands of volunteers making a difference.</p>
        </section>

        <section class="pad stack" style="gap:14px;margin-top:8px;">
          <div class="input-group">
            <label>Full name</label>
            <input type="text" placeholder="e.g. Alex Rivera" />
          </div>
          <div class="input-group">
            <label>Email address</label>
            <input type="email" placeholder="alex@example.com" />
          </div>
          <div class="input-group">
            <label>Phone number</label>
            <input type="tel" placeholder="+1 (555) 000-0000" />
          </div>
          <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Minimum 8 characters" />
          </div>

          <label class="row" style="gap:8px;font-size:13px;color:var(--muted);margin-top:4px;">
            <input type="checkbox" checked style="width:18px;height:18px;accent-color:var(--accent);" />
            I agree to the Terms of Service and Privacy Policy
          </label>
        </section>

        <section class="pad stack" style="gap:10px;margin-top:16px;">
          <button class="btn-primary" onclick="location.href='04-event-store.html'">Create Account</button>
          <p class="text-center meta" style="margin:0;">Already have an account? <a href="03-login.html" style="color:var(--accent);text-decoration:none;font-weight:500;">Sign in</a></p>
        </section>
      </main>

      <div class="home-indicator" aria-hidden></div>
    </div>
  </div>
</body>
</html>
