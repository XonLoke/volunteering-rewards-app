<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Organiser Portal</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
      background: var(--bg);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-8);
    }
    .auth-card .logo {
      text-align: center;
      margin-bottom: var(--space-6);
    }
    .auth-card .logo svg {
      color: var(--accent);
    }
    .auth-card h1 {
      text-align: center;
      font-size: 1.375rem;
      margin-bottom: var(--space-1);
    }
    .auth-card .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
      margin-bottom: var(--space-6);
    }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin: var(--space-6) 0;
      color: var(--muted);
      font-size: 0.8125rem;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      border-top: 1px solid var(--border);
    }
    .auth-footer {
      text-align: center;
      margin-top: var(--space-6);
      font-size: 0.875rem;
      color: var(--muted);
    }
    .password-field {
      position: relative;
    }
    .password-toggle {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8125rem;
      padding: 0.25rem;
    }
    .password-toggle:hover { color: var(--fg); }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
      </div>
      <h1>Sign in</h1>
      <p class="subtitle">Organiser Portal — Organisation Portal</p>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email" class="form-label">Organisation email <span class="required">*</span></label>
          <input type="email" id="email" class="form-input" placeholder="admin@organisation.gov.sg" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password <span class="required">*</span></label>
          <div class="password-field">
            <input type="password" id="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Toggle password visibility">Show</button>
          </div>
        </div>

        <div class="flex items-center justify-between" style="margin-bottom:var(--space-6)">
          <label class="form-checkbox">
            <input type="checkbox" checked> Remember this device
          </label>
          <a href="#" style="font-size:0.8125rem;">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-full" style="justify-content:center;">Sign in</button>
      </form>

      <div class="auth-divider">New organisation?</div>

      <a href="register.html" class="btn btn-secondary w-full" style="justify-content:center;">Register your organisation</a>

      <p class="auth-footer">
        For statutory board accounts only.<br>
        Need help? <a href="#">Contact support</a>
      </p>
    </div>
  </div>

  <script>
    function togglePassword() {
      const pwd = document.getElementById('password');
      const btn = event.target;
      if (pwd.type === 'password') {
        pwd.type = 'text';
        btn.textContent = 'Hide';
      } else {
        pwd.type = 'password';
        btn.textContent = 'Show';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.textContent = 'Signing in…';
      btn.disabled = true;
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1200);
    }
  </script>
</body>
</html>
