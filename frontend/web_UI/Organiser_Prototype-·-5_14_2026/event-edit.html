<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create / Edit Event — Organiser Portal</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .form-page { max-width: 800px; margin: 0 auto; }
    .status-toggle { display: flex; gap: var(--space-2); }
    .status-toggle .btn { flex: 1; justify-content: center; }
    .status-toggle .btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="header-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
        Organiser Portal
      </a>
      <nav class="header-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="events.html" class="active">Events</a>
        <a href="feedback.html">Feedback</a>
        <a href="assessment.html">Assessment</a>
        <a href="onsite-controller.html">On-Site</a>
        <a href="login.html" style="color:var(--danger);">Sign out</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="form-page">

      <div class="page-header">
        <a href="events.html" style="display:inline-flex;align-items:center;gap:var(--space-1);font-size:0.875rem;color:var(--muted);margin-bottom:var(--space-2);">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 12L6 8l4-4"/></svg>
          Back to events
        </a>
        <h1 id="formTitle">Create Event</h1>
        <p>Fill in the event details and assign a person-in-charge.</p>
      </div>

      <div class="card">
        <form id="eventForm" onsubmit="handleSave(event)">

          <!-- Event Details -->
          <div class="form-section" style="margin-bottom:var(--space-6);padding-bottom:var(--space-6);border-bottom:1px solid var(--border);">
            <div style="font-weight:600;font-size:1rem;margin-bottom:var(--space-4);">Event Details</div>

            <div class="form-group">
              <label for="eventName" class="form-label">Event name <span class="required">*</span></label>
              <input type="text" id="eventName" class="form-input" placeholder="e.g. Beach Clean-up — East Coast" required>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="eventDate" class="form-label">Date <span class="required">*</span></label>
                <input type="date" id="eventDate" class="form-input" required>
              </div>
              <div class="form-group">
                <label for="eventTime" class="form-label">Time <span class="required">*</span></label>
                <div class="form-row" style="grid-template-columns:1fr 1fr;gap:var(--space-2);">
                  <input type="time" id="eventTimeStart" class="form-input" required value="08:00">
                  <input type="time" id="eventTimeEnd" class="form-input" required value="12:00">
                </div>
              </div>
            </div>

            <div class="form-group">
              <label for="eventLocation" class="form-label">Location <span class="required">*</span></label>
              <input type="text" id="eventLocation" class="form-input" placeholder="e.g. East Coast Park, Area D" required>
            </div>

            <div class="form-group">
              <label for="eventDesc" class="form-label">Description</label>
              <textarea id="eventDesc" class="form-textarea" placeholder="Describe the event activities, objectives, and any requirements for volunteers…" rows="4"></textarea>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="volunteerCapacity" class="form-label">Volunteer capacity</label>
                <input type="number" id="volunteerCapacity" class="form-input" placeholder="e.g. 30" min="1">
              </div>
              <div class="form-group">
                <label for="eventStatus" class="form-label">Status</label>
                <select id="eventStatus" class="form-select">
                  <option value="draft">Draft</option>
                  <option value="pending" selected>Submit for approval</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Person-in-Charge -->
          <div class="form-section" style="margin-bottom:var(--space-6);padding-bottom:var(--space-6);border-bottom:1px solid var(--border);">
            <div style="font-weight:600;font-size:1rem;margin-bottom:var(--space-4);">Person-in-Charge</div>
            <p class="form-hint" style="margin-bottom:var(--space-3);">Assign the person responsible for on-site coordination and attendance.</p>

            <div class="form-row">
              <div class="form-group">
                <label for="picName" class="form-label">Full name <span class="required">*</span></label>
                <input type="text" id="picName" class="form-input" placeholder="e.g. Sarah Tan" required>
              </div>
              <div class="form-group">
                <label for="picEmail" class="form-label">Email</label>
                <input type="email" id="picEmail" class="form-input" placeholder="sarah@organisation.gov.sg">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="picPhone" class="form-label">Phone number</label>
                <input type="tel" id="picPhone" class="form-input" placeholder="+65 9123 4567">
              </div>
              <div class="form-group">
                <label for="picRole" class="form-label">Role / designation</label>
                <input type="text" id="picRole" class="form-input" placeholder="e.g. Events Coordinator">
              </div>
            </div>
          </div>

          <!-- Actions -->
          <div class="flex justify-end gap-3">
            <a href="events.html" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary" id="saveBtn">Save Event</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script>
    // Simulate edit mode from query param
    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('id');
    const isEdit = editId !== null;

    if (isEdit) {
      document.getElementById('formTitle').textContent = 'Edit Event';
      document.getElementById('saveBtn').textContent = 'Update Event';
      // Prefill with mock data
      document.getElementById('eventName').value = 'Beach Clean-up — East Coast';
      document.getElementById('eventDate').value = '2026-05-18';
      document.getElementById('eventTimeStart').value = '08:00';
      document.getElementById('eventTimeEnd').value = '12:00';
      document.getElementById('eventLocation').value = 'East Coast Park, Area D';
      document.getElementById('eventDesc').value = 'Monthly coastal clean-up. Volunteers will collect and sort waste along the shoreline. Gloves and bags provided.';
      document.getElementById('volunteerCapacity').value = '30';
      document.getElementById('eventStatus').value = 'pending';
      document.getElementById('picName').value = 'Sarah Tan';
      document.getElementById('picEmail').value = 'sarah.tan@nparks.gov.sg';
      document.getElementById('picPhone').value = '+65 9123 4567';
      document.getElementById('picRole').value = 'Events Coordinator';
    }

    function handleSave(e) {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      btn.textContent = isEdit ? 'Updating…' : 'Saving…';
      btn.disabled = true;

      setTimeout(() => {
        showToast(isEdit ? 'Event updated successfully.' : 'Event created and submitted for approval.', 'success');
        btn.textContent = isEdit ? 'Update Event' : 'Save Event';
        btn.disabled = false;
        setTimeout(() => window.location.href = 'events.html', 1200);
      }, 1000);
    }

    function showToast(msg, type) {
      const container = document.getElementById('toast-container') || (() => {
        const c = document.createElement('div');
        c.id = 'toast-container';
        c.className = 'toast-container';
        document.body.appendChild(c);
        return c;
      })();
      const toast = document.createElement('div');
      toast.className = 'toast toast-' + type;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }
  </script>
</body>
</html>
