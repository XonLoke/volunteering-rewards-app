<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Volunteering Rewards</title>
  <link rel="stylesheet" href="/web_portal/shared/admin.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>Admin Portal</h1>
      <p>Sign in to manage the Volunteering Rewards platform</p>

      <div id="errorAlert" class="alert alert-error"></div>

      <form id="loginForm" novalidate>
        <div class="form-group" id="emailGroup">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="admin@example.com" autocomplete="email" />
          <div class="error-text" id="emailError">Please enter a valid email</div>
        </div>

        <div class="form-group" id="passwordGroup">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
          <div class="error-text" id="passwordError">Password is required</div>
        </div>

        <div class="form-options">
          <label>
            <input type="checkbox" id="rememberMe" />
            Remember me
          </label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailGroup = document.getElementById('emailGroup');
    const passwordGroup = document.getElementById('passwordGroup');
    const loginBtn = document.getElementById('loginBtn');
    const errorAlert = document.getElementById('errorAlert');

    function showFieldError(group, message) {
      group.classList.add('has-error');
      const errorText = group.querySelector('.error-text');
      if (errorText) errorText.textContent = message;
    }

    function clearFieldErrors() {
      document.querySelectorAll('.form-group').forEach(g => g.classList.remove('has-error'));
    }

    function showAlert(message) {
      errorAlert.textContent = message;
      errorAlert.style.display = 'block';
    }

    function hideAlert() {
      errorAlert.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      clearFieldErrors();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      // Client-side validation
      let valid = true;
      if (!email) {
        showFieldError(emailGroup, 'Email is required');
        valid = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showFieldError(emailGroup, 'Please enter a valid email');
        valid = false;
      }
      if (!password) {
        showFieldError(passwordGroup, 'Password is required');
        valid = false;
      }
      if (!valid) return;

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const json = await res.json();

        if (!res.ok) {
          const code = json?.error?.code;
          const msg = json?.error?.message || 'Login failed';

          if (code === 'invalid_credentials') {
            showAlert('Invalid email or password. Please try again.');
          } else if (code === 'account_disabled') {
            showAlert('Account is deactivated. Contact an administrator.');
          } else if (code === 'validation_error') {
            if (json?.error?.details?.email) showFieldError(emailGroup, json.error.details.email);
            if (json?.error?.details?.password) showFieldError(passwordGroup, json.error.details.password);
            if (!json?.error?.details) showAlert(msg);
          } else {
            showAlert(msg);
          }
          return;
        }

        // Store token
        localStorage.setItem('admin_token', json.token);
        localStorage.setItem('admin_user', JSON.stringify(json.user));

        if (document.getElementById('rememberMe').checked) {
          localStorage.setItem('remember_admin', 'true');
        }

        // Redirect to dashboard
        window.location.href = '/web_portal/admin/dashboard.html';
      } catch (err) {
        if (err.message === 'Failed to fetch') {
          showAlert('Connection error. Please check your network and try again.');
        } else {
          showAlert(err.message || 'Something went wrong. Please try again.');
        }
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }
    });

    // Pre-fill email if remembered
    const remembered = localStorage.getItem('remember_admin');
    if (remembered) {
      const savedUser = localStorage.getItem('admin_user');
      if (savedUser) {
        try {
          const user = JSON.parse(savedUser);
          if (user.email) emailInput.value = user.email;
        } catch (e) {}
      }
    }
  </script>
</body>
</html>
