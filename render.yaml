# Render Deployment Configuration
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: push to GitHub → Render auto-deploys from main branch
# Manual: render blueprint launch

services:
  # ─── Backend API ──────────────────────────────────────────
  - type: web
    name: volunteering-rewards-api
    env: docker
    repo: https://github.com/XonLoke/volunteering-rewards-app
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # All portals moved to Vercel (5 Aug) — the onrender.com origins are dead.
      # CORS_ORIGINS also lives in the Render dashboard — keep the two in sync.
      - key: CORS_ORIGINS
        value: https://webportals-lovat.vercel.app,https://volunteering-rewards-app.vercel.app
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "5000"
      # Rotated 5 Aug 2026: old literal + the v1 placeholder were both exposed
      # (docs + git history). Keep in sync with the Render dashboard value.
      - key: PIN_SECRET
        value: "023a91777f8f42c37ef71371e4c505af"
      - key: MAX_FILE_SIZE
        value: "1048576"
      - key: FRONTEND_URL
        value: https://volunteering-rewards-app.vercel.app
      # ─── Public demo mode (10 Sep 2026) ───────────────────────
      # The repo is public and the test accounts are intentionally shared
      # (password123) so visitors can drive all four roles. PUBLIC_DEMO_MODE
      # suppresses all outbound email, refuses the config writes that would
      # permanently change programme economics, and self-heals the demo data.
      # Set DEMO_RESET_INTERVAL_MINUTES to 0 for a boot-time reset only.
      # Both are also set in the Render dashboard — keep the two in sync.
      - key: PUBLIC_DEMO_MODE
        value: "true"
      - key: DEMO_RESET_INTERVAL_MINUTES
        value: "60"
      # 🔴 EMAIL_USER and EMAIL_PASS must be set in Render Dashboard.
      #    Works with any SMTP provider. Optional overrides:
      #    SMTP_HOST (default: smtp.gmail.com), SMTP_PORT (default: 587),
      #    SMTP_SECURE (default: false; true for port 465),
      #    EMAIL_FROM_NAME (default: "Volunteer Rewards App")

  # ─── Admin Web Portal ─────────────────────────────────────
  - type: web
    name: volunteering-rewards-admin
    env: static
    repo: https://github.com/XonLoke/volunteering-rewards-app
    branch: main
    buildCommand: cd frontend/web_portals && npm ci && npm run build
    staticPublishPath: frontend/web_portals/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: volunteering-rewards-api
          type: web
          property: host
          value: /api

databases:
  - name: volunteering-rewards-db
    plan: free
    databaseName: volunteering_rewards
    user: postgres
    postgresMajorVersion: 16
    # Note: This Render-managed DB is NOT used in production.
    # The web service uses a Neon PostgreSQL with env vars set manually in the Render dashboard.
    # The `fromDatabase` references were removed from the web service envVars above to prevent
    # Render from injecting a DATABASE_URL that conflicts with Neon's connection settings.
