# Render Deployment Configuration
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: push to GitHub → Render auto-deploys from main branch
# Manual: render blueprint launch

services:
  # ─── Backend API ──────────────────────────────────────────
  - type: web
    name: volunteering-rewards-api
    env: node
    repo: https://github.com/XonLoke/volunteering-rewards-app
    branch: main
    buildCommand: cd backend && npm ci
    startCommand: cd backend && node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: https://volunteering-rewards-admin.onrender.com,https://volunteering-rewards-organiser.onrender.com,https://volunteering-rewards-merchant.onrender.com
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "5000"
      - key: PIN_SECRET
        value: "73128219d055466ea889d7892370bf68"
      - key: MAX_FILE_SIZE
        value: "1048576"
      - key: FRONTEND_URL
        value: https://volunteering-rewards-app.vercel.app
      # 🔴 EMAIL_USER and EMAIL_PASS must be set in Render Dashboard.
      #    Works with any SMTP provider. Optional overrides:
      #    SMTP_HOST (default: smtp.gmail.com), SMTP_PORT (default: 587),
      #    SMTP_SECURE (default: false; true for port 465),
      #    EMAIL_FROM_NAME (default: "Volunteer Rewards App")

  # ─── Admin Web Portal ─────────────────────────────────────
  - type: web
    name: volunteering-rewards-admin
    env: static
    repo: https://github.com/XonLoke/volunteering-rewards-app
    branch: main
    buildCommand: cd frontend/web_portals && npm ci && npm run build
    staticPublishPath: frontend/web_portals/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: volunteering-rewards-api
          type: web
          property: host
          value: /api

databases:
  - name: volunteering-rewards-db
    plan: free
    databaseName: volunteering_rewards
    user: postgres
    postgresMajorVersion: 16
    # Note: This Render-managed DB is NOT used in production.
    # The web service uses a Neon PostgreSQL with env vars set manually in the Render dashboard.
    # The `fromDatabase` references were removed from the web service envVars above to prevent
    # Render from injecting a DATABASE_URL that conflicts with Neon's connection settings.
