name: CI

on:
  push:
    branches: [main, "feature/**", "vivian", "grace", "nurain"]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Check syntax (require() resolution)
        run: node -e "
          const files = [
            'src/config/database',
            'src/middleware/auth.middleware',
            'src/middleware/errorHandler.middleware',
            'src/middleware/rateLimiter.middleware',
            'src/middleware/role.middleware',
            'src/utils/jwt',
            'src/utils/seed',
          ];
          let ok = true;
          for (const f of files) {
            try {
              require('./' + f);
              console.log('  ✓ ' + f);
            } catch (e) {
              console.error('  ✗ ' + f + ' — ' + e.message);
              ok = false;
            }
          }
          process.exit(ok ? 0 : 1);
        "
        working-directory: backend

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: volunteering_rewards_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run migrations
        run: node src/utils/migrationRunner.js
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: volunteering_rewards_test
          DB_USER: postgres
          DB_PASSWORD: test123
          JWT_ACCESS_SECRET: ci-test-access-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret

      - name: Run seed
        run: node src/utils/seed.js
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: volunteering_rewards_test
          DB_USER: postgres
          DB_PASSWORD: test123
          JWT_ACCESS_SECRET: ci-test-access-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret

      - name: Run tests
        run: npm test
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: volunteering_rewards_test
          DB_USER: postgres
          DB_PASSWORD: test123
          JWT_ACCESS_SECRET: ci-test-access-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log deployment
        run: echo "Deployment trigger ready — add your target (Render / Railway / Fly.io) here"
