name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 20
  # src/utils/jwt.js binds its secrets at module load and throws when they are
  # missing, so the lint job (which `require()`s it) needs them or it fails
  # before a single test runs. Same throwaway values the test job already sets.
  JWT_ACCESS_SECRET: ci-test-access-secret
  JWT_REFRESH_SECRET: ci-test-refresh-secret
  # Defensive, same one-level-down reasoning: src/services/rewards.service.js
  # throws at module load when NODE_ENV=production and PIN_SECRET is unset, and
  # merchant.service pulls it in. This job does not set NODE_ENV, so the throw
  # cannot fire today — but a future `NODE_ENV: production` added here would
  # otherwise break the lint job for a reason unrelated to the code under test.
  PIN_SECRET: ci-test-pin-secret

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      # NOTE: this must be a literal block scalar (`run: |`) fed to a quoted
      # heredoc. The previous form was `run: node -e "…"`, whose value YAML
      # reads as a PLAIN scalar — and a plain scalar ends at the first ": ",
      # which the JS below contains on its final line. That truncated the
      # script mid-statement and made the file unparseable, so GitHub produced
      # no jobs at all: this workflow never ran once. `<<'NODE'` also stops the
      # shell touching the script (no $ or backtick expansion).
      - name: Check syntax (require() resolution)
        run: |
          node <<'NODE'
          const files = [
            'src/config/database',
            'src/config/demoMode',
            'src/middleware/auth.middleware',
            'src/middleware/errorHandler.middleware',
            'src/middleware/rateLimiter.middleware',
            'src/middleware/role.middleware',
            'src/services/admin.service',
            'src/services/demoReset.service',
            'src/services/leaderboard.service',
            'src/services/merchant.service',
            'src/utils/jwt',
            'src/utils/seed',
          ];
          let ok = true;
          for (const f of files) {
            try {
              require('./' + f);
              console.log('  ✓ ' + f);
            } catch (e) {
              console.error('  ✗ ' + f + ' — ' + e.message);
              ok = false;
            }
          }
          process.exit(ok ? 0 : 1);
          NODE
        working-directory: backend

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: volunteering_rewards_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run migrations
        run: node src/utils/migrationRunner.js
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: volunteering_rewards_test
          DB_USER: postgres
          DB_PASSWORD: test123
          JWT_ACCESS_SECRET: ci-test-access-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret

      - name: Run seed
        run: node src/utils/seed.js
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: volunteering_rewards_test
          DB_USER: postgres
          DB_PASSWORD: test123
          JWT_ACCESS_SECRET: ci-test-access-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret

      - name: Run tests
        run: npm test
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: volunteering_rewards_test
          DB_USER: postgres
          DB_PASSWORD: test123
          JWT_ACCESS_SECRET: ci-test-access-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log deployment
        run: echo "Deployment trigger ready — add your target (Render / Railway / Fly.io) here"
