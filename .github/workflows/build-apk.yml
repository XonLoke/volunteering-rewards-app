# =============================================================================
# build-apk.yml
# Volunteer Rewards App — Android APK Build (Expo SDK 54)
#
# PURPOSE:
#   Build a debug APK from the Expo mobile project in frontend/mobile_app/.
#   SDK 54 natively includes expo-module-gradle-plugin via expo-modules-core@3.x,
#   eliminating ALL the plugin patching and Kotlin version conflicts from SDK 52.
#
# TRIGGERS:
#   - Manual dispatch (workflow_dispatch): primary trigger for on-demand APK builds
#   - Push to 'apk-build' branch: optional CI trigger for the build branch
#
# SECRETS REQUIRED:
#   None for debug APK. For release/signed APK, add:
#   - ANDROID_KEYSTORE_BASE64
#   - ANDROID_KEY_ALIAS
#   - ANDROID_KEY_PASSWORD
#   - ANDROID_STORE_PASSWORD
# =============================================================================

name: Build Android APK

on:
  # Allow manual trigger from GitHub UI (Actions tab → Run workflow)
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

  # Automatically build when pushing to this dedicated branch
  push:
    branches:
      - apk-build

# Cancel any in-progress builds if a new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK (Expo SDK 54)
    # Ubuntu runner — required for EAS local builds and Gradle builds
    # Windows runners do NOT support eas build --local
    runs-on: ubuntu-latest

    # -----------------------------------------------------------
    # Environment: pin versions to ensure reproducible builds
    # -----------------------------------------------------------
    env:
      # Java version — must match what Expo SDK 54 / AGP 8.6 expects
      JAVA_VERSION: '17'
      # Node version — Expo SDK 54 requires Node 18+
      NODE_VERSION: '20'
      # Working directory — all npm/gradle commands run from here
      MOBILE_APP_DIR: frontend/mobile_app

    steps:
      # ----------------------------------------------------------------
      # STEP 1: Checkout the full repository
      # ----------------------------------------------------------------
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so expo prebuild has git context
          fetch-depth: 0

      # ----------------------------------------------------------------
      # STEP 2: Set up Java (JDK 17)
      # Expo SDK 54 + AGP 8.6 officially targets JDK 17.
      # JDK 21 may cause subtle toolchain issues — stick with 17.
      # ----------------------------------------------------------------
      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          # Cache Gradle dependencies between workflow runs
          cache: 'gradle'

      # ----------------------------------------------------------------
      # STEP 3: Set up Android SDK
      # Installs the command-line tools and required SDK packages.
      # ----------------------------------------------------------------
      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Accept all SDK licenses automatically
          accept-android-sdk-licenses: true

      # ----------------------------------------------------------------
      # STEP 4: Install additional Android SDK components
      # The setup-android action installs basics; we need specific versions.
      # ----------------------------------------------------------------
      - name: 📦 Install Android SDK packages
        run: |
          echo "Installing required Android SDK packages..."
          sdkmanager --install \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "platform-tools" \
            --sdk_root=$ANDROID_SDK_ROOT
          echo "✅ Android SDK packages installed"

      # ----------------------------------------------------------------
      # STEP 5: Set up Node.js
      # ----------------------------------------------------------------
      - name: 🟢 Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Cache node_modules based on lock file for faster builds
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            ${{ env.MOBILE_APP_DIR }}/package-lock.json

      # ----------------------------------------------------------------
      # STEP 6: Install root-level dependencies
      # The root workspace may contain shared Expo tooling.
      # ----------------------------------------------------------------
      - name: 📦 Install root dependencies
        run: |
          echo "Installing root workspace dependencies..."
          npm ci --prefer-offline || npm install
          echo "✅ Root dependencies installed"

      # ----------------------------------------------------------------
      # STEP 7: Install mobile_app dependencies
      # Uses npm ci for reproducible installs from package-lock.json.
      # Falls back to npm install if lock file is missing/outdated.
      # ----------------------------------------------------------------
      - name: 📦 Install mobile_app dependencies
        working-directory: ${{ env.MOBILE_APP_DIR }}
        run: |
          echo "Installing mobile app dependencies..."
          npm ci --prefer-offline || npm install
          echo "✅ Mobile app dependencies installed"

      # ----------------------------------------------------------------
      # STEP 8: Verify expo-module-gradle-plugin is present
      # This is the plugin that was MISSING in SDK 52 and caused all the
      # cascading failures. With SDK 54, it ships in expo-modules-core@3.x.
      # If this step fails, the SDK version is wrong.
      # ----------------------------------------------------------------
      - name: 🔍 Verify expo-module-gradle-plugin exists
        working-directory: ${{ env.MOBILE_APP_DIR }}
        run: |
          PLUGIN_PATH=$(find node_modules -path "*/expo-module-gradle-plugin/build.gradle" -o -path "*/expo-module-gradle-plugin/build.gradle.kts" 2>/dev/null | head -1)
          if [ -z "$PLUGIN_PATH" ]; then
            echo "❌ expo-module-gradle-plugin NOT FOUND"
            echo "This means expo-modules-core < 3.x is installed (SDK 52 or lower)"
            echo ""
            echo "Current expo-modules-core version:"
            cat node_modules/expo-modules-core/package.json | grep '"version"' || echo "Not found"
            echo ""
            echo "Fix: Run 'npx expo upgrade 54' in frontend/mobile_app/ and commit the changes"
            exit 1
          fi
          echo "✅ expo-module-gradle-plugin found at: $PLUGIN_PATH"
          echo ""
          echo "expo-modules-core version:"
          cat node_modules/expo-modules-core/package.json | grep '"version"'

      # ----------------------------------------------------------------
      # STEP 9: Run expo prebuild (clean)
      # Generates the android/ native project folders from the
      # Expo config (app.json / app.config.js).
      # --clean ensures we start fresh (removes stale android/ directory)
      # CI=1 makes it fully non-interactive.
      # ----------------------------------------------------------------
      - name: 🔧 Run expo prebuild --clean
        working-directory: ${{ env.MOBILE_APP_DIR }}
        run: |
          echo "Running expo prebuild (clean mode)..."
          CI=1 npx expo prebuild --clean --platform android
          echo "✅ Prebuild complete — android/ directory generated"
          echo ""
          echo "Generated files:"
          ls -la android/

      # ----------------------------------------------------------------
      # STEP 10: Verify Gradle wrapper is present and executable
      # The gradlew file should have been generated by expo prebuild.
      # ----------------------------------------------------------------
      - name: 🔐 Fix Gradle wrapper permissions
        working-directory: ${{ env.MOBILE_APP_DIR }}/android
        run: |
          if [ ! -f "gradlew" ]; then
            echo "❌ gradlew not found — expo prebuild may have failed"
            exit 1
          fi
          chmod +x gradlew
          echo "✅ gradlew is executable"
          echo ""
          # Print Gradle version for debugging
          ./gradlew --version

      # ----------------------------------------------------------------
      # STEP 11: Patch expo-module-gradle-plugin (missing settings.gradle.kts)
      # The expo-modules-core@3.x plugin ships without a settings.gradle.kts
      # in its expo-module-gradle-plugin/ directory. Without it, Gradle
      # can't resolve the included build's plugin dependencies (Kotlin JVM).
      # See: docs/to_be_debug_for_APK_Build.md (v2)
      #
      # The sibling expo-gradle-plugin HAS this file and works — we mirror it.
      # ----------------------------------------------------------------
      - name: 🔧 Patch expo-module-gradle-plugin settings
        working-directory: ${{ env.MOBILE_APP_DIR }}
        run: |
          PLUGIN_DIR="node_modules/expo-modules-core/expo-module-gradle-plugin"
          if [ ! -f "$PLUGIN_DIR/settings.gradle.kts" ]; then
            echo 'pluginManagement {' > "$PLUGIN_DIR/settings.gradle.kts"
            echo '  repositories {' >> "$PLUGIN_DIR/settings.gradle.kts"
            echo '    mavenCentral()' >> "$PLUGIN_DIR/settings.gradle.kts"
            echo '    google()' >> "$PLUGIN_DIR/settings.gradle.kts"
            echo '    gradlePluginPortal()' >> "$PLUGIN_DIR/settings.gradle.kts"
            echo '  }' >> "$PLUGIN_DIR/settings.gradle.kts"
            echo '}' >> "$PLUGIN_DIR/settings.gradle.kts"
            echo '' >> "$PLUGIN_DIR/settings.gradle.kts"
            echo 'rootProject.name = "expo-module-gradle-plugin"' >> "$PLUGIN_DIR/settings.gradle.kts"
            echo "✅ Created $PLUGIN_DIR/settings.gradle.kts with plugin repos"
          else
            echo "✅ settings.gradle.kts already exists"
          fi
          cat "$PLUGIN_DIR/settings.gradle.kts"

      # ----------------------------------------------------------------
      # STEP 12: Cache Gradle build outputs
      # Significantly speeds up subsequent builds.
      # ----------------------------------------------------------------
      - name: 💾 Cache Gradle build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.MOBILE_APP_DIR }}/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ----------------------------------------------------------------
      # STEP 13: Build the APK
      # assembleDebug — unsigned debug APK (no keystore required)
      # assembleRelease — would require signing config
      #
      # --stacktrace: print full stack traces on failure (essential for debugging)
      # --no-daemon: CI environments shouldn't run persistent daemons
      # ----------------------------------------------------------------
      - name: 🏗️ Build ${{ github.event.inputs.build_type == 'release' && 'Release' || 'Debug' }} APK
        working-directory: ${{ env.MOBILE_APP_DIR }}/android
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          GRADLE_TASK="assemble${BUILD_TYPE^}"
          echo "Starting Gradle $GRADLE_TASK build..."
          ./gradlew "$GRADLE_TASK" \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"
          echo "✅ Gradle build complete"

      # ----------------------------------------------------------------
      # STEP 14: Locate the built APK
      # Expo/RN projects output APKs to app/build/outputs/apk/debug/
      # ----------------------------------------------------------------
      - name: 📍 Locate built APK
        working-directory: ${{ env.MOBILE_APP_DIR }}
        id: locate-apk
        run: |
          APK_PATH=$(find android -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ No APK found after build. Check Gradle output above."
            exit 1
          fi
          echo "✅ APK found: $APK_PATH"
          echo "APK size: $(du -sh "$APK_PATH" | cut -f1)"
          # Export for use in the upload step
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------------
      # STEP 15: Upload APK as a workflow artifact
      # Download from: Actions tab → click the workflow run → Artifacts section
      # Retained for 30 days by default.
      # ----------------------------------------------------------------
      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: volunteer-rewards-${{ github.event.inputs.build_type || 'debug' }}-apk-${{ github.run_number }}
          path: ${{ env.MOBILE_APP_DIR }}/${{ steps.locate-apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      # ----------------------------------------------------------------
      # STEP 16: Print build summary
      # ----------------------------------------------------------------
      - name: 📊 Build Summary
        if: success()
        run: |
          echo "============================================"
          echo "✅ APK BUILD SUCCESSFUL"
          echo "============================================"
          echo ""
          echo "APK Location (in artifact): ${{ steps.locate-apk.outputs.apk_path }}"
          echo "Artifact Name: volunteer-rewards-${{ github.event.inputs.build_type || 'debug' }}-apk-${{ github.run_number }}"
          echo ""
          echo "To download: Go to Actions tab → this workflow run → Artifacts section"
          echo "To install:  adb install <downloaded-apk-file>"
          echo "============================================"

      # ----------------------------------------------------------------
      # STEP 17: On failure — dump useful diagnostics
      # Prints Gradle properties, node_modules state, and env info
      # to help with debugging without having to re-run the workflow.
      # ----------------------------------------------------------------
      - name: 🔎 Diagnostic dump on failure
        if: failure()
        working-directory: ${{ env.MOBILE_APP_DIR }}
        run: |
          echo "======== ENVIRONMENT ========"
          java -version
          node --version
          npm --version
          echo ""
          echo "======== EXPO DOCTOR ========"
          npx expo-doctor || true
          echo ""
          echo "======== KEY PACKAGE VERSIONS ========"
          cat package.json | grep -E '"expo"|"react-native"|"expo-modules-core"' || true
          echo ""
          echo "======== ANDROID DIR CONTENTS ========"
          ls -la android/ 2>/dev/null || echo "android/ not generated"
          echo ""
          echo "======== GRADLE PROPERTIES ========"
          cat android/gradle.properties 2>/dev/null || echo "gradle.properties not found"
          echo ""
          echo "======== SETTINGS.GRADLE ========"
          cat android/settings.gradle 2>/dev/null || echo "settings.gradle not found"
          echo ""
          echo "======== EXPO-MODULES-CORE VERSION ========"
          cat node_modules/expo-modules-core/package.json 2>/dev/null | grep '"version"' || echo "Not installed"
