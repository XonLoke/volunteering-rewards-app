name: Build APK

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile_app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/mobile_app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ''

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK platform (SDK 36 for RN 0.81.5)
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" --sdk_root=$ANDROID_SDK_ROOT
          echo "SDK 36 installed ✓"

      - name: Install root dependencies
        working-directory: .
        run: |
          for i in 1 2 3; do
            npm install --no-audit --no-fund 2>&1 && echo "Root deps installed" && break
            if [ $i -eq 3 ]; then echo "All 3 retries failed"; exit 1; fi
            echo "Retry $i failed, waiting 10s..." && sleep 10
          done

      - name: Install mobile_app dependencies
        working-directory: frontend/mobile_app
        run: npm install --no-audit --no-fund

      - name: Verify expo-module-gradle-plugin exists (SDK 54 ships it)
        run: |
          PLUGIN_PATH=$(find node_modules -path "*/expo-module-gradle-plugin/build.gradle*" 2>/dev/null | head -1)
          if [ -z "$PLUGIN_PATH" ]; then
            echo "❌ Plugin not found — expo-modules-core may be < 3.x"
            cat node_modules/expo-modules-core/package.json | grep '"version"'
            exit 1
          fi
          echo "✅ Plugin found at: $PLUGIN_PATH"

          # Create settings.gradle.kts if missing (needed for CI)
          PLUGIN_DIR=$(dirname "$PLUGIN_PATH")
          if [ ! -f "$PLUGIN_DIR/settings.gradle.kts" ]; then
            echo 'pluginManagement {
              repositories {
                mavenCentral()
                google()
                gradlePluginPortal()
              }
            }
            rootProject.name = "expo-module-gradle-plugin"' > "$PLUGIN_DIR/settings.gradle.kts"
            echo "Created settings.gradle.kts ✓"
          fi

      - name: Prebuild (generate native project)
        run: npx expo prebuild --platform android --no-install

      - name: Patch expo-module-gradle-plugin settings
        run: |
          PLUGIN_DIR="node_modules/expo-modules-core/expo-module-gradle-plugin"
          if [ ! -f "$PLUGIN_DIR/settings.gradle.kts" ]; then
            echo 'pluginManagement {
              repositories {
                mavenCentral()
                google()
                gradlePluginPortal()
              }
            }
            rootProject.name = "expo-module-gradle-plugin"' > "$PLUGIN_DIR/settings.gradle.kts"
            echo "Created settings.gradle.kts ✓"
          else
            echo "settings.gradle.kts already exists ✓"
          fi

      - name: Create splash screen placeholder (referenced by expo-splash-screen)
        run: |
          mkdir -p android/app/src/main/res/drawable
          # 1x1 transparent PNG as base64
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > android/app/src/main/res/drawable/splashscreen_logo.png
          echo "✅ Splash screen placeholder created"

      - name: Build APK (with production API URL)
        run: |
          cd android
          chmod +x gradlew
          export EXPO_PUBLIC_API_URL=https://vol-rewards-api.onrender.com/api
          echo "EXPO_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL"
          if [ "${{ github.event.inputs.build-type }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.build-type }}.apk
          path: frontend/mobile_app/android/app/build/outputs/apk/${{ github.event.inputs.build-type }}/app-*.apk
          retention-days: 30
