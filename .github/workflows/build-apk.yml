name: Build APK

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile_app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/mobile_app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install root dependencies (expo SDK 54 → expo-modules-core@3.x)
        working-directory: .
        run: |
          for i in 1 2 3; do
            npm install --no-audit --no-fund 2>&1 && echo "Root deps installed" && break
            if [ $i -eq 3 ]; then echo "All 3 retries failed"; exit 1; fi
            echo "Retry $i failed, waiting 10s..." && sleep 10
          done

      - name: Install mobile_app dependencies
        working-directory: frontend/mobile_app
        run: npm install --no-audit --no-fund

      - name: Copy expo-module-gradle-plugin from root to mobile_app
        run: |
          cp -r ../../node_modules/expo-modules-core/expo-module-gradle-plugin node_modules/expo-modules-core/
          echo 'rootProject.name = "expo-module-gradle-plugin"' > node_modules/expo-modules-core/expo-module-gradle-plugin/settings.gradle.kts
          echo "Plugin copied. Version:"
          node -e "console.log(require('./node_modules/expo-modules-core/package.json').version)" 2>/dev/null || true

      - name: Prebuild (generate native project)
        run: npx expo prebuild --platform android --no-install

      - name: Patch Gradle config for AGP compatibility
        run: |
          # Pin AGP to 8.6.0 (compatible with RN 0.76 + expo-modules-core)
          sed -i "s/classpath('com.android.tools.build:gradle')/classpath('com.android.tools.build:gradle:8.6.0')/" android/build.gradle

          # Add Kotlin resolution strategy + google() repos to pluginManagement
          sed -i "s|pluginManagement {|pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n    resolutionStrategy {\n        eachPlugin {\n            if (requested.id.namespace == 'org.jetbrains.kotlin') {\n                useVersion('1.9.25')\n            }\n        }\n    }|" android/settings.gradle

          # Add expo-module-gradle-plugin as included build after the RN plugin line
          sed -i "s|includeBuild(new File(\[\"node\", \"--print\", \"require.resolve('@react-native/gradle-plugin/package.json'|includeBuild(new File(new File([\"node\", \"--print\", \"require.resolve('expo-modules-core/package.json', { paths: [require.resolve('expo/package.json')] })\"].execute(null, rootDir).text.trim()).getParentFile(), \"expo-module-gradle-plugin\"))\n    includeBuild(new File([\"node\", \"--print\", \"require.resolve('@react-native/gradle-plugin/package.json'|" android/settings.gradle

          # Fix 'release' component error in ExpoModulesCorePlugin.gradle
          sed -i "s/from components.release/from components.getByName('release')/" node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle

          echo "=== Patches applied ==="
          grep "com.android.tools.build" android/build.gradle
          head -16 android/settings.gradle

      - name: Build APK
        run: |
          cd android
          if [ "${{ github.event.inputs.build-type }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.build-type }}.apk
          path: frontend/mobile_app/android/app/build/outputs/apk/${{ github.event.inputs.build-type }}/app-*.apk
          retention-days: 30
