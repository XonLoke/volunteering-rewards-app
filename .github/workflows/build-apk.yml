name: Build APK

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile_app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/mobile_app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install root dependencies (expo SDK 54 → latest plugin versions)
        working-directory: .
        run: |
          for i in 1 2 3; do
            npm install --no-audit --no-fund 2>&1 && echo "Root deps installed" && break
            if [ $i -eq 3 ]; then echo "All 3 retries failed"; exit 1; fi
            echo "Retry $i failed, waiting 10s..." && sleep 10
          done

      - name: Install mobile_app dependencies
        working-directory: frontend/mobile_app
        run: npm install --no-audit --no-fund

      - name: Copy Gradle plugins from root (newer versions include them)
        run: |
          # Copy expo-module-gradle-plugin (from expo-modules-core@3.x)
          cp -r ../../node_modules/expo-modules-core/expo-module-gradle-plugin node_modules/expo-modules-core/
          echo 'rootProject.name = "expo-module-gradle-plugin"' > node_modules/expo-modules-core/expo-module-gradle-plugin/settings.gradle.kts

          # Copy expo-gradle-plugin (from expo-modules-autolinking root version)
          mkdir -p node_modules/expo-modules-autolinking/android
          cp -r ../../node_modules/expo-modules-autolinking/android/expo-gradle-plugin node_modules/expo-modules-autolinking/android/

          echo "Plugins copied ✓"

      - name: Prebuild (generate native project)
        run: npx expo prebuild --platform android --no-install

      - name: Patch Gradle config for compatibility
        run: |
          # 1. Pin AGP to 8.6.0 (matches RN 0.76 requirement)
          sed -i "s/classpath('com.android.tools.build:gradle')/classpath('com.android.tools.build:gradle:8.6.0')/" android/build.gradle

          # 2. Add plugin repositories to pluginManagement
          sed -i "s|pluginManagement {|pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }|" android/settings.gradle

          # 4. Add includeBuild for expo-gradle-plugin (from expo-modules-autolinking)
          sed -i "s|includeBuild(new File(\[\"node\", \"--print\", \"require.resolve('@react-native/gradle-plugin/package.json'|includeBuild(new File(new File([\"node\", \"--print\", \"require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })\"].execute(null, rootDir).text.trim()).getParentFile(), \"android/expo-gradle-plugin\"))\n    includeBuild(new File([\"node\", \"--print\", \"require.resolve('@react-native/gradle-plugin/package.json'|" android/settings.gradle

          # 5. Fix release component in ExpoModulesCorePlugin.gradle
          #    Use findByName to guard against missing component in AGP 8.x
          if grep -q "components.getByName" node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle; then
            sed -i "s|from components.getByName('release')|def releaseComp = components.findByName(\"release\"); if (releaseComp != null) { from releaseComp }|" node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
          else
            sed -i "s|from components.release|def releaseComp = components.findByName(\"release\"); if (releaseComp != null) { from releaseComp }|" node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
          fi

          # 6. Remove Kotlin version from expo-module-gradle-plugin (use classpath version)
          sed -i 's/kotlin("jvm") version "[^"]*"/kotlin("jvm")/' node_modules/expo-modules-core/expo-module-gradle-plugin/build.gradle.kts

          echo "=== Patches applied ==="
          echo "AGP:" && grep "com.android.tools.build" android/build.gradle
          echo "Kotlin:" && grep "kotlin(\"jvm\")" node_modules/expo-modules-core/expo-module-gradle-plugin/build.gradle.kts
          echo "Release component:" && grep "findByName" node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle

      - name: Build APK
        run: |
          cd android
          if [ "${{ github.event.inputs.build-type }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.build-type }}.apk
          path: frontend/mobile_app/android/app/build/outputs/apk/${{ github.event.inputs.build-type }}/app-*.apk
          retention-days: 30
